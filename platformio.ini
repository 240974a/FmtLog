; Проверка библиотеки.
;
;   pio test -e native        тесты на машине разработчика, плата не нужна
;   pio run -e esp8266        сборка примера под плату
;
; Какой пример собирается, задаёт src_dir: по умолчанию Basic.

[platformio]
src_dir = examples/Basic

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
; Сама библиотека: корень проекта подключается как зависимость, поэтому
; примеры находят её заголовки и никакой установки для проверки не нужно.
lib_deps = symlink://.
build_flags = -Wall -Wextra

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
; Сама библиотека: корень проекта подключается как зависимость, поэтому
; примеры находят её заголовки и никакой установки для проверки не нужно.
lib_deps = symlink://.
build_flags = -Wall -Wextra

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; Сама библиотека: корень проекта подключается как зависимость, поэтому
; примеры находят её заголовки и никакой установки для проверки не нужно.
lib_deps = symlink://.
build_flags = -Wall -Wextra

; Тесты идут без платы: Arduino подменяется заглушкой из test/mocks, а
; исходники библиотеки включаются в сборку теста напрямую.
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra -I test/mocks -I src
test_filter = test_*
