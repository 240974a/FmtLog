name=FmtLog
version=1.1.0
author=Aleksey Grishin <g-iot@mail.ru>
maintainer=Aleksey Grishin <g-iot@mail.ru>
sentence=Форматирование строк по образцу {} и лёгкий журнал для микроконтроллеров.
paragraph=Сообщение задаётся образцом, где место каждого значения помечено {} - текст виден целиком и не разорван знаками вставки. Без динамической памяти и без std::string: буфер задаётся снаружи и не растёт. Готовые правила вывода для чисел, строк во флеше и EEPROM, даты и времени, длительностей, IP-адресов и дампов памяти; свой тип подключается одной специализацией formatter<T>. Журнал поверх того же форматирования: уровни, источники, сменные приёмники вывода и отсечение по уровню на этапе компиляции. Цветной вывод в терминал и чтение строк из EEPROM подключаются отдельными заголовками и не занимают места, пока не нужны.
category=Communication
url=https://github.com/240974a/FmtLog
architectures=esp8266,esp32,avr
includes=FmtLog.h
license=MIT
